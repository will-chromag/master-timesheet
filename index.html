
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chromag Bikes Timesheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b; /* Chromag warm gold/amber */
      --accent-hover: #d97706;
      --primary: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
      line-height: 1.4;
    }
    header {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .brand-badge {
      background: var(--accent);
      color: #000;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .user-pill span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-pill svg { width: 14px; height: 14px; stroke: var(--text-muted); }

    .sync-bar {
      background: #182234;
      border-bottom: 1px solid #243044;
      padding: 6px 18px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sync-status { display: flex; align-items: center; gap: 6px; font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .dot.saving { background: var(--accent); animation: pulse 1s infinite; }
    .dot.error { background: var(--danger); }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Pay Period Navigator */
    .period-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .nav-btn {
      background: #334155;
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .period-title {
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
    }
    .period-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Total Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 10px;
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
    }
    .stat-box { text-align: center; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; color: #fff; margin-top: 2px; }
    .stat-val.highlight { color: var(--accent); }

    /* Week Sections */
    .week-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 20px 0 10px 4px;
      display: flex;
      justify-content: space-between;
    }

    /* Day Card */
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      transition: border-color 0.15s ease;
    }
    .day-card.today {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .day-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .day-name { font-weight: 700; font-size: 0.95rem; }
    .day-today-tag {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .day-hours-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
    }
    .day-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 0.8fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .input-group label {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      padding: 8px 10px;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .quick-clock-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .quick-btn {
      flex: 1;
      background: #253347;
      border: 1px solid #3b4d66;
      color: #cbd5e1;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .quick-btn:hover { background: #2f4059; color: #fff; }
    .notes-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      resize: vertical;
      min-height: 38px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-content {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal-header h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 4px; }
    .modal-header p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px; }
    .search-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .staff-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .staff-opt {
      text-align: left;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px 14px;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .staff-opt:active, .staff-opt:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header>
    <div class="brand">
      <div class="brand-title">CHROMAG</div>
      <div class="brand-badge">Hours</div>
    </div>
    <div class="user-pill" onclick="openPicker()">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span id="activeUser">Select Name</span>
    </div>
  </header>

  <!-- Auto-save Sync Status Bar -->
  <div class="sync-bar">
    <div class="sync-status">
      <div class="dot" id="syncDot"></div>
      <span id="syncText">Connected</span>
    </div>
    <span id="scriptIndicator" style="cursor:pointer;" onclick="editScriptUrl()">Settings</span>
  </div>

  <div class="container">
    <!-- Pay Period Header Card -->
    <div class="period-card">
      <div class="nav-row">
        <button class="nav-btn" onclick="changePeriod(-1)">&larr;</button>
        <div>
          <div class="period-title" id="periodDates">Nov 2 &ndash; Nov 15, 2026</div>
          <div class="period-sub">14-Day Pay Period</div>
        </div>
        <button class="nav-btn" onclick="changePeriod(1)">&rarr;</button>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Week 1</div>
          <div class="stat-val" id="week1Total">0.0h</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Week 2</div>
          <div class="stat-val" id="week2Total">0.0h</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Period Total</div>
          <div class="stat-val highlight" id="periodTotal">0.0h</div>
        </div>
      </div>
    </div>

    <!-- 14 Days List -->
    <div id="daysList"></div>
  </div>

  <!-- Name Picker Modal -->
  <div class="modal-backdrop hidden" id="pickerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Who is logging time?</h2>
        <p>Pick your name once. All hours will route directly to your personal tab in Google Sheets.</p>
        <input type="text" class="search-box" id="nameFilter" placeholder="Type your name..." oninput="filterStaff()">
      </div>
      <div class="staff-list" id="staffOptions"></div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURATION
    // -------------------------------------------------------------
    // Put your Google Apps Script Web App URL here
    let SCRIPT_URL = localStorage.getItem("chromag_script_url") || "https://script.google.com/macros/s/AKfycbyNnFwO7HJghaxHanimYNxeZgn91naM1Mj57xKUfmmd3lEmkY7a2OaI70O9b83bmCTP/exec";

    // Team Members List (Edit with actual Chromag staff names)
    const STAFF_MEMBERS = [
      "Alex Rivera", "Brenda Vance", "Carlos Mendez", "Dana Scully",
      "David Kim", "Elena Rostova", "Frank Castle", "Grace Hopper",
      "Hannah Abbott", "Ian Malcolm", "Jack Ryan", "Karen Page",
      "Liam Neeson", "Maya Lin", "Nathan Drake", "Olivia Dunham",
      "Peter Parker", "Quinn Fabray", "Rachel Green", "Samwise Gamgee",
      "Tara Maclay", "Victor Stone", "Wanda Maximoff"
    ].sort();

    // Anchor period: Monday, Nov 2, 2026
    const ANCHOR_DATE = new Date(2026, 10, 2); // Month is 0-indexed (10 = Nov)
    let periodOffset = 0; // 0 = current/anchor period

    let currentUser = localStorage.getItem("chromag_user") || "";
    let syncTimer = null;

    // -------------------------------------------------------------
    // INITIALIZATION
    // -------------------------------------------------------------
    window.addEventListener("DOMContentLoaded", () => {
      // Check query param (?user=Name)
      const params = new URLSearchParams(window.location.search);
      if (params.get("user")) {
        currentUser = params.get("user");
        localStorage.setItem("chromag_user", currentUser);
      }

      if (!currentUser) {
        openPicker();
      } else {
        document.getElementById("activeUser").textContent = currentUser;
      }

      renderPeriod();
    });

    // -------------------------------------------------------------
    // PAY PERIOD & DATES
    // -------------------------------------------------------------
    function getPeriodRange(offset) {
      const start = new Date(ANCHOR_DATE);
      start.setDate(start.getDate() + (offset * 14));
      
      const end = new Date(start);
      end.setDate(end.getDate() + 13);
      
      return { start, end };
    }

    function changePeriod(delta) {
      periodOffset += delta;
      renderPeriod();
    }

    function formatDateShort(d) {
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function toISODate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderPeriod() {
      const { start, end } = getPeriodRange(periodOffset);
      document.getElementById("periodDates").textContent = 
        `${formatDateShort(start)} – ${formatDateShort(end)}, ${start.getFullYear()}`;

      const container = document.getElementById("daysList");
      container.innerHTML = "";

      const todayStr = toISODate(new Date());

      for (let i = 0; i < 14; i++) {
        const curDate = new Date(start);
        curDate.setDate(curDate.getDate() + i);
        const iso = toISODate(curDate);
        const isToday = (iso === todayStr);

        if (i === 0) {
          container.appendChild(createWeekDivider("Week 1 (Days 1–7)"));
        } else if (i === 7) {
          container.appendChild(createWeekDivider("Week 2 (Days 8–14)"));
        }

        // Get saved data from localStorage
        const saved = getStoredDay(iso);

        const card = document.createElement("div");
        card.className = `day-card ${isToday ? 'today' : ''}`;
        card.id = `card_${iso}`;

        const dayDisplay = curDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        card.innerHTML = `
          <div class="day-top">
            <div>
              <span class="day-name">${dayDisplay}</span>
              ${isToday ? '<span class="day-today-tag">TODAY</span>' : ''}
            </div>
            <div class="day-hours-badge" id="badge_${iso}">${saved.totalHours > 0 ? saved.totalHours.toFixed(1) + 'h' : '0.0h'}</div>
          </div>

          <div class="quick-clock-row">
            <button type="button" class="quick-btn" onclick="quickClock('${iso}', 'start')">Clock In Now</button>
            <button type="button" class="quick-btn" onclick="quickClock('${iso}', 'end')">Clock Out Now</button>
            <button type="button" class="quick-btn" onclick="clearDay('${iso}')">Clear</button>
          </div>

          <div class="day-inputs">
            <div class="input-group">
              <label>Start</label>
              <input type="time" id="start_${iso}" value="${saved.startTime || ''}" onchange="onDayChange('${iso}')">
            </div>
            <div class="input-group">
              <label>End</label>
              <input type="time" id="end_${iso}" value="${saved.endTime || ''}" onchange="onDayChange('${iso}')">
            </div>
            <div class="input-group">
              <label>Break (m)</label>
              <input type="number" id="break_${iso}" value="${saved.breakMinutes !== undefined ? saved.breakMinutes : 30}" min="0" step="5" onchange="onDayChange('${iso}')">
            </div>
          </div>

          <textarea class="notes-input" id="notes_${iso}" placeholder="Notes on tasks, projects, or off-day..." oninput="onDayChange('${iso}')">${saved.notes || ''}</textarea>
        `;

        container.appendChild(card);
      }

      updateTotals();
    }

    function createWeekDivider(text) {
      const div = document.createElement("div");
      div.className = "week-header";
      div.textContent = text;
      return div;
    }

    // -------------------------------------------------------------
    // CALCULATIONS & STORAGE
    // -------------------------------------------------------------
    function calcDayHours(startVal, endVal, breakMins) {
      if (!startVal || !endVal) return 0;
      const [sh, sm] = startVal.split(":").map(Number);
      const [eh, em] = endVal.split(":").map(Number);
      
      let startMinutes = sh * 60 + sm;
      let endMinutes = eh * 60 + em;
      
      if (endMinutes < startMinutes) {
        endMinutes += 24 * 60; // Crosses midnight
      }
      
      let worked = endMinutes - startMinutes - (Number(breakMins) || 0);
      if (worked < 0) worked = 0;
      return Math.round((worked / 60) * 100) / 100;
    }

    function storageKey(iso) {
      return `entry_${currentUser}_${iso}`;
    }

    function getStoredDay(iso) {
      if (!currentUser) return {};
      const raw = localStorage.getItem(storageKey(iso));
      return raw ? JSON.parse(raw) : {};
    }

    function onDayChange(iso) {
      const start = document.getElementById(`start_${iso}`).value;
      const end = document.getElementById(`end_${iso}`).value;
      const breakMins = document.getElementById(`break_${iso}`).value;
      const notes = document.getElementById(`notes_${iso}`).value;

      const totalHours = calcDayHours(start, end, breakMins);
      document.getElementById(`badge_${iso}`).textContent = totalHours > 0 ? totalHours.toFixed(1) + 'h' : '0.0h';

      const entry = {
        dateStr: iso,
        startTime: start,
        endTime: end,
        breakMinutes: Number(breakMins) || 0,
        totalHours: totalHours,
        notes: notes
      };

      if (currentUser) {
        localStorage.setItem(storageKey(iso), JSON.stringify(entry));
      }

      updateTotals();
      triggerAutoSync(entry);
    }

    function quickClock(iso, type) {
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      
      if (type === 'start') {
        document.getElementById(`start_${iso}`).value = timeStr;
      } else {
        document.getElementById(`end_${iso}`).value = timeStr;
      }
      onDayChange(iso);
    }

    function clearDay(iso) {
      document.getElementById(`start_${iso}`).value = '';
      document.getElementById(`end_${iso}`).value = '';
      document.getElementById(`notes_${iso}`).value = '';
      onDayChange(iso);
    }

    function updateTotals() {
      const { start } = getPeriodRange(periodOffset);
      let w1 = 0, w2 = 0;

      for (let i = 0; i < 14; i++) {
        const curDate = new Date(start);
        curDate.setDate(curDate.getDate() + i);
        const iso = toISODate(curDate);
        const saved = getStoredDay(iso);
        const hrs = Number(saved.totalHours) || 0;
        
        if (i < 7) w1 += hrs;
        else w2 += hrs;
      }

      document.getElementById("week1Total").textContent = w1.toFixed(1) + 'h';
      document.getElementById("week2Total").textContent = w2.toFixed(1) + 'h';
      document.getElementById("periodTotal").textContent = (w1 + w2).toFixed(1) + 'h';
    }

    // -------------------------------------------------------------
    // GOOGLE SHEETS AUTO-SYNC
    // -------------------------------------------------------------
    function triggerAutoSync(entry) {
      if (!currentUser) return;
      if (!SCRIPT_URL || SCRIPT_URL.includes("PASTE_YOUR")) {
        setSyncStatus("No Apps Script URL configured", "error");
        return;
      }

      setSyncStatus("Syncing to sheet...", "saving");
      clearTimeout(syncTimer);

      syncTimer = setTimeout(async () => {
        try {
          const payload = {
            staffName: currentUser,
            ...entry
          };

          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          setSyncStatus(`Synced to ${currentUser}'s tab ✓`, "normal");
        } catch (e) {
          setSyncStatus("Sync failed. Check connection.", "error");
        }
      }, 700);
    }

    function setSyncStatus(msg, state) {
      const text = document.getElementById("syncText");
      const dot = document.getElementById("syncDot");
      text.textContent = msg;
      dot.className = "dot";
      if (state === "saving") dot.classList.add("saving");
      if (state === "error") dot.classList.add("error");
    }

    // -------------------------------------------------------------
    // NAME PICKER MODAL
    // -------------------------------------------------------------
    function openPicker() {
      document.getElementById("pickerModal").classList.remove("hidden");
      renderStaffOptions(STAFF_MEMBERS);
    }

    function renderStaffOptions(list) {
      const container = document.getElementById("staffOptions");
      container.innerHTML = "";
      list.forEach(name => {
        const btn = document.createElement("button");
        btn.className = "staff-opt";
        btn.textContent = name;
        btn.onclick = () => selectStaff(name);
        container.appendChild(btn);
      });
    }

    function filterStaff() {
      const q = document.getElementById("nameFilter").value.toLowerCase();
      renderStaffOptions(STAFF_MEMBERS.filter(n => n.toLowerCase().includes(q)));
    }

    function selectStaff(name) {
      currentUser = name;
      localStorage.setItem("chromag_user", name);
      document.getElementById("activeUser").textContent = name;
      document.getElementById("pickerModal").classList.add("hidden");
      renderPeriod();
    }

    function editScriptUrl() {
      const val = prompt("Enter your Google Apps Script Web App URL:", SCRIPT_URL);
      if (val) {
        SCRIPT_URL = val.trim();
        localStorage.setItem("chromag_script_url", SCRIPT_URL);
        alert("Script URL updated!");
      }
    }
  </script>
</body>
</html>
